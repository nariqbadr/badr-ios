name: BadrTilawat
options:
  bundleIdPrefix: com.bawazirquran
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: 1.4.0
targets:
  BadrTilawat:
    type: application
    platform: iOS
    sources:
      - path: BadrTilawat
    dependencies:
      - package: Adhan
      - target: BadrWidgets
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: BadrTilawat/BadrTilawat.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.bawazirquran.app
        PRODUCT_NAME: BadrTilawat
        MARKETING_VERSION: "2.10.55"
        CURRENT_PROJECT_VERSION: "70"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BadrTilawat/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    info:
      path: BadrTilawat/Info.plist
      properties:
        CFBundleDisplayName: بدر التلاوات
        CFBundleName: BadrTilawat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.bawazirquran.app
            CFBundleURLSchemes: [badr]
        UIAppFonts: [amiri_regular.ttf, amiri_bold.ttf, amiri_quran.ttf, plex_regular.ttf, plex_medium.ttf, plex_semibold.ttf, plex_bold.ttf, kfgqpc_hafs.ttf, scheherazade_new.ttf, aref_ruqaa_bold.ttf, reem_kufi.ttf, tajawal_bold.ttf, lateef_regular.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        NSLocationWhenInUseUsageDescription: لحساب مواقيت الصلاة واتجاه القبلة لمدينتك.
        NSPhotoLibraryUsageDescription: لإرفاق الصور في منشورات المجتمع.
        NSPhotoLibraryAddUsageDescription: لحفظ تصاميم الآيات في الصور.
        ITSAppUsesNonExemptEncryption: false
  BadrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BadrWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bawazirquran.app.widgets
        PRODUCT_NAME: BadrWidgets
        MARKETING_VERSION: "2.10.55"
        CURRENT_PROJECT_VERSION: "70"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BadrWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BadrWidgets/BadrWidgets.entitlements
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BadrWidgets/Info.plist
      properties:
        CFBundleDisplayName: بدر التلاوات
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        UIAppFonts: [amiri_quran.ttf, amiri_bold.ttf, plex_regular.ttf, plex_semibold.ttf, plex_bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
