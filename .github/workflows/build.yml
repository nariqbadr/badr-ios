name: Build iPhone app (unsigned IPA for Sideloadly)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          test -n "$X" || { echo "::error::no Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project BadrTilawat.xcodeproj -scheme BadrTilawat -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -150 > errors.txt || true
          cat errors.txt
      - name: Publish build errors early (branch ci-logs)
        if: always()
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cd /tmp/ci && git init -q
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/errors.txt" . 2>/dev/null || true
          cp -R "$GITHUB_WORKSPACE/shots" . 2>/dev/null || true
          echo "${GITHUB_SHA}" > sha.txt; echo building-sim > stage.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-logs && git add -A && git commit -qm "build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
      - name: Simulator run (screenshots + crash check)
        if: always() && contains(github.event.head_commit.message, '[shots]')
        env:
          TL: ${{ secrets.BZ_TEST_LOGIN }}
          TP: ${{ secrets.BZ_TEST_PASS }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p shots
          grep -q "BUILD SUCCEEDED" build.log || { echo "device build failed, skip"; exit 0; }
          xcodebuild -project BadrTilawat.xcodeproj -scheme BadrTilawat -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild ONLY_ACTIVE_ARCH=YES ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { grep -E "error:" sim.log | head -40 > shots/sim-errors.txt; exit 0; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']; best=None
          for rt,devs in d.items():
            if 'iOS' not in rt: continue
            v=tuple(int(x) for x in re.findall(r'\d+',rt.split('iOS')[-1]))
            for x in devs:
              if re.match(r'iPhone \d+( Pro)?$',x['name']) and (best is None or v>best[0]): best=(v,x['udid'],x['name'],rt)
          print(best[1]); print(best[2],best[3],file=sys.stderr)")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" simbuild/Build/Products/Release-iphonesimulator/BadrTilawat.app
          xcrun simctl privacy "$UDID" grant all com.bawazirquran.app || true
          : > shots/runs.txt
          # a first launch that downloads the site's data (the shots that follow open at once, from the saved copy)
          SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_ROUTE=home xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1; sleep 30
          for r in ${BZ_SHOTS:-whatsnew whatsnew@silver mushaf home recitations quran surah read mushaf drawer prayer prayerSettings player watch live liveMd adhkar friday fadail imams imamAlerts lang}; do
            T=""; case "$r" in *@*) T="${r##*@}";; esac
            SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_THEME="$T" SIMCTL_CHILD_BZ_ROUTE="${r%@*}" xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1
            sleep 14
            if xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.bawazirquran.app; then echo "$r ok" >> shots/runs.txt; else echo "$r CRASHED" >> shots/runs.txt; fi
            xcrun simctl io "$UDID" screenshot "shots/$r.png" >/dev/null 2>&1 || true
          done
          # the community as a signed-in test member (credentials from the repository's secrets): sign in, then the feed, scrolled
          if [ -n "$TL" ]; then
            SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_LOGIN="$TL" SIMCTL_CHILD_BZ_PASS="$TP" SIMCTL_CHILD_BZ_ROUTE=community xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1; sleep 20
            if xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.bawazirquran.app; then echo "community-in ok" >> shots/runs.txt; else echo "community-in CRASHED" >> shots/runs.txt; fi
            xcrun simctl io "$UDID" screenshot "shots/community-in.png" >/dev/null 2>&1 || true
          fi
          # the same screens in other languages (English, Urdu)
          for x in en:home en:live en:liveMd en:imams en:imamAlerts en:surah en:drawer en:recitations en:prayer en:player ur:home ur:imams ur:surah; do
            L=${x%%:*}; r=${x#*:}
            SIMCTL_CHILD_BZ_LANG=$L SIMCTL_CHILD_BZ_ROUTE=$r xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1
            sleep 14
            if xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.bawazirquran.app; then echo "$L-$r ok" >> shots/runs.txt; else echo "$L-$r CRASHED" >> shots/runs.txt; fi
            xcrun simctl io "$UDID" screenshot "shots/$L-$r.png" >/dev/null 2>&1 || true
          done
          # the opening, held at a few moments (to compare with the site's and Android's frames)
          for t in 0.6 1.2 1.8 2.4 3.0 3.6; do
            SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_ROUTE=intro SIMCTL_CHILD_BZ_INTRO_T=$t xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/intro-$t.png" >/dev/null 2>&1 || true
          done
          # the first open after an update for someone who had the app: the intro, then What's New (no home screen between)
          SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_EXISTING=1 xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1
          for i in 01 02 03 04 05 06 07 08 09 10 11 12 13 14; do xcrun simctl io "$UDID" screenshot "shots/flow-$i.png" >/dev/null 2>&1 || true; sleep 0.3; done
          xcrun simctl terminate "$UDID" com.bawazirquran.app || true
          find ~/Library/Logs/DiagnosticReports -name "BadrTilawat*" -exec cp {} shots/ \; 2>/dev/null || true
          cat shots/runs.txt
      - name: Mosques in the simulator (screenshots at a real place in Cairo)
        if: always() && contains(github.event.head_commit.message, '[mosques]')
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p shots
          grep -q "BUILD SUCCEEDED" build.log || { echo "device build failed, skip"; exit 0; }
          xcodebuild -project BadrTilawat.xcodeproj -scheme BadrTilawat -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild ONLY_ACTIVE_ARCH=YES ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 || { grep -E "error:" sim.log | head -40 > shots/sim-errors.txt; exit 0; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys,re
          d=json.load(sys.stdin)['devices']; best=None
          for rt,devs in d.items():
            if 'iOS' not in rt: continue
            v=tuple(int(x) for x in re.findall(r'\d+',rt.split('iOS')[-1]))
            for x in devs:
              if re.match(r'iPhone \d+( Pro)?$',x['name']) and (best is None or v>best[0]): best=(v,x['udid'],x['name'],rt)
          print(best[1])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Release-iphonesimulator/BadrTilawat.app
          xcrun simctl privacy "$UDID" grant all com.bawazirquran.app || true
          xcrun simctl privacy "$UDID" grant location-always com.bawazirquran.app || true
          xcrun simctl location "$UDID" set 30.0784,31.3016 || true
          : > shots/mq-runs.txt
          SIMCTL_CHILD_BZ_LANG=ar SIMCTL_CHILD_BZ_ROUTE=home xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1; sleep 30
          for x in ar:list ar:dial ar:near ar:steps ar:jum ar:walk en:list en:steps; do
            L=${x%%:*}; m=${x#*:}
            SIMCTL_CHILD_BZ_LANG=$L SIMCTL_CHILD_BZ_ROUTE=mosques SIMCTL_CHILD_BZ_MQ=$m xcrun simctl launch --terminate-running-process "$UDID" com.bawazirquran.app >/dev/null 2>&1
            sleep 35
            if xcrun simctl spawn "$UDID" launchctl list | grep -q UIKitApplication:com.bawazirquran.app; then echo "$L-$m ok" >> shots/mq-runs.txt; else echo "$L-$m CRASHED" >> shots/mq-runs.txt; fi
            xcrun simctl io "$UDID" screenshot "shots/mq-$L-$m.png" >/dev/null 2>&1 || true
          done
          xcrun simctl terminate "$UDID" com.bawazirquran.app || true
          find ~/Library/Logs/DiagnosticReports -name "BadrTilawat*" -exec cp {} shots/ \; 2>/dev/null || true
          cat shots/mq-runs.txt
      - name: Publish log (branch ci-logs)
        if: always()
        run: |
          rm -rf /tmp/ci && mkdir -p /tmp/ci && cd /tmp/ci && git init -q
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/errors.txt" . 2>/dev/null || true
          cp -R "$GITHUB_WORKSPACE/shots" . 2>/dev/null || true
          echo "${GITHUB_SHA}" > sha.txt
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-logs && git add -A && git commit -qm "build ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
      - name: Package IPA
        run: |
          test -f build/Build/Products/Release-iphoneos/BadrTilawat.app/BadrTilawat
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/BadrTilawat.app Payload/
          zip -qry BadrTilawat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BadrTilawat-ipa
          path: BadrTilawat.ipa
