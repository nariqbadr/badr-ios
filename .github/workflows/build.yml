name: Build iPhone app (unsigned IPA for Sideloadly)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project BadrTilawat.xcodeproj -scheme BadrTilawat -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/BadrTilawat.app
      - name: Package IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/BadrTilawat.app Payload/
          zip -qry BadrTilawat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BadrTilawat-ipa
          path: BadrTilawat.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
