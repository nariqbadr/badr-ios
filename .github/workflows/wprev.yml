name: Widget pictures (tests)
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wprev:
    if: contains(github.event.head_commit.message, '[wprev]')
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - name: Build and draw
        run: |
          mkdir -p out
          brew install xcodegen && xcodegen generate --spec wprev.yml
          xcodebuild -project WPrev.xcodeproj -scheme WPrev -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath pbuild ONLY_ACTIVE_ARCH=YES ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO build > out/build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" out/build.log | sort -u | head -60 > out/errors.txt; cat out/errors.txt
          grep -q "BUILD SUCCEEDED" out/build.log || exit 0
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" pbuild/Build/Products/Debug-iphonesimulator/WPrev.app
          xcrun simctl launch "$UDID" com.bawazirquran.wprev
          D=$(xcrun simctl get_app_container "$UDID" com.bawazirquran.wprev data)
          for i in $(seq 1 30); do [ -f "$D/Documents/done.txt" ] && break; sleep 3; done
          cp "$D"/Documents/*.png out/ 2>/dev/null || true; ls out
      - name: Publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b wprev-out && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "wprev ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wprev-out
