name: peek
on:
  push:
    branches: [peek]
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Save the public site data to the peek-data branch (to test the apps' reading of it)
        run: |
          mkdir out && cd out
          curl -s -m 60 "https://bawazirquran.com/wp-admin/admin-ajax.php?action=bz&do=data" -o data.json
          git init -q && git checkout -q -b peek-data && git add data.json
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm data
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" peek-data
