name: peek
on:
  push:
    branches: [peek]
permissions:
  contents: write
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Save the public site data to the peek-data branch (to test the apps' reading of it)
        run: |
          mkdir out && cd out
          B="https://bawazirquran.com/wp-admin/admin-ajax.php?action=bz"
          curl -s -m 60 "$B&do=data" -o data.json
          curl -s -m 60 "$B&do=mosques_near&lat=30.1128&lng=31.3422" -o mosques.json
          curl -s -m 30 "https://overpass-api.de/api/status" -o overpass-status.txt || true
          curl -s -m 60 "$B&do=c_feed&tab=all&before=0" -o feed-all.json
          curl -s -m 60 "$B&do=c_feed&tab=latest&before=0" -o feed-latest.json
          curl -s -m 60 "$B&do=c_suggest" -o suggest.json
          for h in $(python3 -c "import json;print(' '.join(p.get('handle','') for p in json.load(open('suggest.json')).get('data',json.load(open('suggest.json'))).get('people',[])[:8]))" 2>/dev/null); do curl -s -m 30 "$B&do=c_user&handle=$h&tab=posts&before=0" -o "user-$h.json"; done
          # the imams' photos: does the site serve them?
          python3 -c "import json;d=json.load(open('data.json'));d=d.get('data',d);print('\n'.join(x.get('photo','') for x in d['site']['live']['imams']['people'] if x.get('photo')))" > photos.txt || true
          while read u; do echo "$(curl -s -o /dev/null -m 20 -w '%{http_code} %{content_type} %{size_download}' "$u") $u"; done < photos.txt > photos-status.txt
          # the adhan voices: does the site serve them, and in what format?
          python3 -c "import json,urllib.parse as U;d=json.load(open('data.json'));d=d.get('data',d);S='https://bawazirquran.com';print('\n'.join(((S+x[k]) if x[k].startswith('/') else x[k]) for x in d.get('adhans',[])+d.get('iqamas',[]) for k in ('url','fajr') if x.get(k)))" > adhans.txt || true
          while IFS= read -r u; do e=$(python3 -c "import sys,urllib.parse as U;print(U.quote(sys.argv[1],safe=':/?&=%'))" "$u"); echo "$(curl -s -o /tmp/a -m 60 -w '%{http_code} %{content_type} %{size_download} %{time_total}s' "$e") $(head -c 16 /tmp/a | xxd -p) $(file -b /tmp/a | cut -c1-80) | $u"; done < adhans.txt > adhans-status.txt
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
          # how long each adhan is, and where it is silent (a long silent start sounds like «it does not play»)
          while IFS= read -r u; do e=$(python3 -c "import sys,urllib.parse as U;print(U.quote(sys.argv[1],safe=':/?&=%'))" "$u"); curl -s -m 60 -o /tmp/a.mp3 "$e"; echo "== $u"; ffprobe -v error -show_entries format=duration:stream=codec_name,sample_rate,channels,bit_rate -of compact /tmp/a.mp3; ffmpeg -hide_banner -nostats -i /tmp/a.mp3 -af silencedetect=n=-45dB:d=2,volumedetect -f null - 2>&1 | grep -E "silence_|mean_volume|max_volume" | head -20; done < adhans.txt > adhans-audio.txt 2>&1 || true
          git init -q && git checkout -q -b peek-data && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm data
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" peek-data
