name: peek
on:
  push:
    branches: [peek]
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Public site data (the weekly imams)
        run: |
          curl -s -m 60 "https://bawazirquran.com/wp-admin/admin-ajax.php?action=bz&do=data" -o d.json
          python3 -c "
          import json; j=json.load(open('d.json')); l=j['site'].get('live',{}); im=l.get('imams',{})
          print(json.dumps({k:v for k,v in im.items() if k!='people'}, ensure_ascii=False, indent=1)[:6000])
          print('people', len(im.get('people',[])), json.dumps(im.get('people',[])[:2], ensure_ascii=False)[:800])
          print('live keys', list(l.keys()))
          "
