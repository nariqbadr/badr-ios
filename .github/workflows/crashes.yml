name: TestFlight crash reports
on:
  push:
    branches: [crashes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crashes:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: pip3 install -q pyjwt cryptography && python3 scripts/asc.py crashes
