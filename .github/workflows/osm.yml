name: osm-check
on: { push: { branches: [osmcheck] } }
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="BadrTilawat/check (+https://bawazirquran.com)"
          LA=30.1118; LO=31.3437
          A="(around:3000,$LA,$LO)"
          for LIM in " 120" ""; do
            Q="[out:json][timeout:25];(nwr[\"amenity\"=\"place_of_worship\"][\"religion\"=\"muslim\"]$A;nwr[\"building\"=\"mosque\"]$A;);out center tags$LIM;"
            curl -s -A "$UA" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter > o.json
            python3 - "$LIM" <<'P'
          import json,sys,math
          d=json.load(open('o.json')); els=d['elements']
          la,lo=30.1118,31.3437
          def m(e):
              y=e.get('lat') or e['center']['lat']; x=e.get('lon') or e['center']['lon']
              return math.hypot((y-la)*111320,(x-lo)*111320*math.cos(math.radians(la)))
          print("limit",repr(sys.argv[1]),"count",len(els), "named", sum(1 for e in els if e.get('tags',{}).get('name')))
          ids=[e['id'] for e in els]
          print(" gwairya in:",14404117120 in ids, " max node id:", max(i for e,i in zip(els,ids) if e['type']=='node'))
          for e in sorted(els,key=m)[:12]:
              t=e.get('tags',{}); print(f"   {int(m(e)):5d}m {e['type']}/{e['id']} {t.get('name','-')}")
          P
          done
