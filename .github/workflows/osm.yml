name: osm-check
on: { push: { branches: [osmcheck] } }
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="BadrTilawat/check (+https://bawazirquran.com)"
          Q='[out:json][timeout:25];nwr["amenity"="place_of_worship"](around:600,30.111283,31.3412941);out center tags meta;'
          curl -s -A "$UA" --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter > o.json
          python3 - <<'P'
          import json,math
          d=json.load(open('o.json'))
          la,lo=30.111283,31.3412941
          for e in d['elements']:
              y=e.get('lat') or e['center']['lat']; x=e.get('lon') or e['center']['lon']
              m=math.hypot((y-la)*111320,(x-lo)*111320*math.cos(math.radians(la)))
              t=e.get('tags',{})
              print(f"{int(m):5d}m {e['type']}/{e['id']} {y:.6f},{x:.6f} name={t.get('name','-')} rel={t.get('religion','-')} bld={t.get('building','-')} user={e.get('user')} v={e.get('version')}")
          P
