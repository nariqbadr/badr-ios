name: mosque-tiles
# every mosque in OpenStreetMap, from Geofabrik's extracts (the public Overpass servers turn a whole-world sweep away),
# cut into 1-degree cells and published on the branch mosque-tiles (served by jsDelivr). Monthly.
on:
  schedule:
    - cron: "17 3 2 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mosque-tiles
  cancel-in-progress: true
jobs:
  region:
    strategy:
      fail-fast: false
      matrix:
        r: [africa, antarctica, asia, australia-oceania, central-america, europe, north-america, russia, south-america]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Room for the extract
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          sudo mkdir -p /mnt/osm && sudo chown $USER /mnt/osm
          df -h / /mnt
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install --quiet osmium || pip install --quiet --break-system-packages osmium
      - name: Download ${{ matrix.r }}
        run: |
          D=/mnt/osm; [ $(df --output=avail -B1G /mnt | tail -1) -gt $(df --output=avail -B1G / | tail -1) ] || D=$HOME/osm; mkdir -p $D
          echo "D=$D" >> $GITHUB_ENV
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 -A "BadrTilawat-mosque-tiles/1.0 (+https://bawazirquran.com)" -o $D/x.osm.pbf https://download.geofabrik.de/${{ matrix.r }}-latest.osm.pbf
          ls -la $D
      - name: Places of worship only
        run: |
          osmium tags-filter $D/x.osm.pbf nwr/amenity=place_of_worship nwr/building=mosque -o $D/pow.osm.pbf --overwrite
          rm -f $D/x.osm.pbf; ls -la $D
      - name: Mosques into cells
        run: mkdir -p /tmp/part && python3 tools/pbf.py $D/pow.osm.pbf /tmp/part ${{ matrix.r }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.r }}
          path: /tmp/part/part-${{ matrix.r }}.json
          retention-days: 3
  publish:
    needs: region
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: /tmp/parts
      - name: Join the regions
        run: python3 tools/merge.py /tmp/parts /tmp/out 9
      - name: Publish (branch mosque-tiles)
        run: |
          cd /tmp/out && printf 'Mosques from OpenStreetMap, cut into 1-degree cells for the Badr apps.\nData © OpenStreetMap contributors, available under the Open Database License (ODbL) 1.0: https://www.openstreetmap.org/copyright\n' > README.md
          git init -q && git checkout -q -b mosque-tiles && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "mosque tiles ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mosque-tiles
