name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python3 probe.py > out/log.txt 2>&1; tail -50 out/log.txt
      - name: publish
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b probe-out && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm out
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out
